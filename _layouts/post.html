---
layout: default
---

<div class="container">
  <article>
    <div class="post-header">
      <h1>{{ page.title }}</h1>
      <div class="post-meta">
        <span><i class="fas fa-calendar"></i> {{ page.date | date: "%B %d, %Y" }}</span>
        <span><i class="fas fa-user"></i> {{ page.author }}</span>
      </div>
    </div>
    
    <div class="post-content">
      {{ content }}
    </div>
    
    {% if page.tags %}
    <div class="blog-tags" style="margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border-subtle);">
      {% for tag in page.tags %}
      <span class="pub-tag">{{ tag }}</span>
      {% endfor %}
    </div>
    {% endif %}
  </article>
  
  <div style="text-align: center; margin-top: 40px;">
    <a href="{{ '/blog' | relative_url }}" class="btn btn-primary">
      <i class="fas fa-arrow-left"></i> Back to Blog
    </a>
  </div>
</div>
